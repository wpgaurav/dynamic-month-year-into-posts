name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  phpcs:
    name: PHP Coding Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, cs2pr

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run PHPCS
        run: composer phpcs -- --report-full --report-checkstyle=./phpcs-report.xml

      - name: Show PHPCS results in PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: cs2pr ./phpcs-report.xml

  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run PHPStan
        run: composer phpstan

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.2', '8.5' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run PHPUnit
        run: composer test

  js-build:
    name: JavaScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Run JavaScript unit tests
        run: npm run test:js -- --runInBand

      - name: Build JavaScript
        run: npm run build

      - name: Check build artifacts
        run: |
          ls -la build/
          test -f build/index.js
          test -f build/blocks/countdown/view.js
          grep -q '^import' build/blocks/countdown/view.js

  js-lint:
    name: JavaScript Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:js

      - name: Run Stylelint
        run: npm run lint:css

  wordpress-smoke:
    name: WordPress ${{ matrix.wordpress }} Runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.5'
            core: 'WordPress/WordPress#6.5'
          - wordpress: 'latest'
            core: 'WordPress/WordPress#master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Configure wp-env
        env:
          WP_CORE: ${{ matrix.core }}
        run: |
          jq -n --arg core "$WP_CORE" \
            '{core: $core, phpVersion: "8.2", plugins: ["."]}' > .wp-env.json

      - name: Start WordPress
        run: npx wp-env start

      - name: Exercise plugin runtime
        run: |
          npx wp-env run cli wp plugin activate dynamic-month-year-into-posts
          npx wp-env run cli wp dmyip test
          npx wp-env run cli wp eval '
            $rendered = do_shortcode("[year]|[month]|[blackfriday]");
            if (substr_count($rendered, "|") !== 2) {
              WP_CLI::error("Unexpected shortcode output");
            }
            foreach (["dynamic_date", "nextoccurrence", "daysuntilnext", "occurrenceyear"] as $unexpected) {
              if (shortcode_exists($unexpected)) {
                WP_CLI::error("Unexpected public shortcode: " . $unexpected);
              }
            }
            if (!WP_Block_Type_Registry::get_instance()->is_registered("dmyip/countdown")) {
              WP_CLI::error("Countdown block was not registered");
            }
            $blocks = parse_blocks("<!-- wp:dmyip/countdown {\"targetDate\":\"2000-01-01\",\"recurring\":true} /-->");
            $countdown = render_block($blocks[0]);
            if (!preg_match("/>\\d+ days<\\/span>/", $countdown)) {
              WP_CLI::error("Countdown server fallback is empty");
            }
            WP_CLI::success($rendered);
          '

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop

  release-check:
    name: Release Package Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install npm dependencies
        run: npm ci

      - name: Build JavaScript
        run: npm run build

      - name: Generate production vendor
        run: |
          VENDOR_TMP=$(mktemp -d)
          cp composer.json composer.lock "$VENDOR_TMP/"
          composer install --no-dev --optimize-autoloader --no-interaction --working-dir="$VENDOR_TMP"
          echo "VENDOR_TMP=$VENDOR_TMP" >> "$GITHUB_ENV"

      - name: Assemble release package
        run: |
          SLUG="dynamic-month-year-into-posts"
          mkdir -p "release/${SLUG}"
          rsync -a \
            --exclude-from=".distignore" \
            --exclude="release" \
            . "release/${SLUG}/"
          cp -r "$VENDOR_TMP/vendor" "release/${SLUG}/"
          cp composer.json "release/${SLUG}/"
          find release -name ".DS_Store" -delete 2>/dev/null || true
          find release -name "*.map" -delete 2>/dev/null || true
          find release -type d -empty -delete 2>/dev/null || true

      - name: Verify release package
        run: |
          SLUG="dynamic-month-year-into-posts"
          DIST="release/${SLUG}"
          ERRORS=0
          for f in \
            "${SLUG}.php" \
            "index.php" \
            "uninstall.php" \
            "readme.txt" \
            "composer.json" \
            "vendor/autoload.php" \
            "build/index.js" \
            "build/blocks/countdown/view.js" \
            "src/Plugin.php" \
            "src/Date/DateEngine.php" \
            "src/Date/DateRenderer.php" \
            "src/blocks/dynamic-date/render.php"; do
            if [ ! -f "$DIST/$f" ]; then
              echo "::warning::Missing: $f"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ -d "$DIST/vendor/phpstan" ] || \
             [ -d "$DIST/vendor/phpunit" ] || \
             [ -d "$DIST/vendor/squizlabs" ]; then
            echo "::error::Dev dependencies leaked into vendor/"
            ERRORS=$((ERRORS + 1))
          fi
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Release package has $ERRORS issue(s)"
            exit 1
          fi
          echo "Release package OK"
          find "$DIST" -type f | wc -l | xargs -I{} echo "File count: {}"
